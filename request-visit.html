<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلب زيارة | PlayPass</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1a33">
<link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
<a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
<header class="site-header" id="siteHeader"></header>
<main class="container" id="main">
  <div class="section"><div class="form-card">
    <h2 style="margin-top:0">📝 نموذج طلب الزيارة</h2>
    <div id="clubBox"></div><div id="msg"></div>
    <div class="field"><label>الأنشطة المطلوبة (اختر واحداً على الأقل)</label><div class="checks" id="actChecks"></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label for="start">تاريخ بداية الزيارة</label><input id="start" type="date"></div>
      <div class="field"><label for="end">تاريخ نهاية الزيارة</label><input id="end" type="date"></div>
    </div>
    <div class="field"><label for="notes">ملاحظات اختيارية</label><textarea id="notes" rows="3" placeholder="أخبر النادي عن مستواك أو أهدافك..."></textarea></div>
    <button class="btn btn-primary" style="width:100%" onclick="submitReq()">إرسال الطلب إلى النادي ✈️</button>
    <p class="hint" style="color:var(--muted);font-size:.85rem">بالإرسال ستصبح حالة طلبك <b>قيد المراجعة ⏳</b> ويمكنك متابعتها في صفحة «طلباتي».</p>
  </div></div>
</main>
<footer id="siteFooter"></footer><div id="toasts"></div>
<script src="js/seed.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
<script>
renderChrome("clubs");
const s = requireRole(["player"], "login.html");
const club = DB.club(qs("club"));
if(!club){ document.getElementById("clubBox").innerHTML = '<div class="alert err">اختر النادي أولاً من <a href="clubs.html">صفحة الأندية</a>.</div>'; }
else{
  document.getElementById("clubBox").innerHTML = `<div class="alert info">تتقدم بطلب إلى: <b>${esc(club.name)}</b> ${club.flag} — ${esc(club.country)}</div>`;
  document.getElementById("actChecks").innerHTML = club.activities.map((a,i)=>
    `<label class="check"><input type="checkbox" value="${esc(a)}"><span><b>${esc(a)}</b></span></label>`).join("");
  const t = new Date().toISOString().slice(0,10);
  document.getElementById("start").min = t; document.getElementById("end").min = t;
}
function submitReq(){
  if(!club || !s){ location.href = !s ? "login.html" : "clubs.html"; return; }
  const acts = [...document.querySelectorAll("#actChecks input:checked")].map(i=>i.value);
  const start = document.getElementById("start").value, end = document.getElementById("end").value;
  const notes = document.getElementById("notes").value.trim();
  const box = document.getElementById("msg");
  if(!acts.length){ box.innerHTML = '<div class="alert err">اختر نشاطاً واحداً على الأقل.</div>'; return; }
  if(!start || !end){ box.innerHTML = '<div class="alert err">حدد تاريخي البداية والنهاية.</div>'; return; }
  if(end < start){ box.innerHTML = '<div class="alert err">تاريخ النهاية يجب أن يكون بعد البداية.</div>'; return; }
  const r = DB.createRequest({ playerId: s.id, clubId: club.id, activities: acts, start, end, notes });
  toast("تم إرسال طلبك بنجاح 🎉");
  setTimeout(()=> location.href = "request-details.html?id=" + r.id, 600);
}
</script>
</body>
</html>
