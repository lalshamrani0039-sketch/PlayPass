<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم المشرف | PlayPass</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1a33">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
<header class="site-header" id="siteHeader"></header>
<main class="container" id="main">
  <div class="dash">
    <aside class="side" aria-label="قائمة المشرف">
      <a href="#" class="active" onclick="tab('over',this);return false">📊 الإحصائيات</a>
      <a href="#" onclick="tab('users',this);return false">👥 المستخدمون</a>
      <a href="#" onclick="tab('clubs',this);return false">🏟️ الأندية</a>
      <a href="#" onclick="tab('reqs',this);return false">📋 الطلبات</a>
    </aside>
    <div>
      <div id="pane-over"></div>
      <div id="pane-users" style="display:none"></div>
      <div id="pane-clubs" style="display:none"></div>
      <div id="pane-reqs" style="display:none"></div>
    </div>
  </div>
</main>
<footer id="siteFooter"></footer><div id="toasts"></div>
<script src="js/seed.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
<script>
renderChrome("admin");
const s = requireRole(["admin"], "login.html");
function tab(t, el){
  document.querySelectorAll(".side a").forEach(a=>a.classList.remove("active"));
  if(el) el.classList.add("active");
  ["over","users","clubs","reqs"].forEach(k=> document.getElementById("pane-"+k).style.display = k===t ? "" : "none");
}
function render(){
  if(!s) return;
  const db = DB.all();
  const nU = db.users.length, nC = db.clubs.length, nR = db.requests.length;
  const pa = db.requests.filter(r=>r.status==="approved").length,
        pp = db.requests.filter(r=>r.status==="pending").length,
        pr = db.requests.filter(r=>r.status==="rejected").length;
  const pct = v => nR ? Math.round(v/nR*100) : 0;

  document.getElementById("pane-over").innerHTML = `
    <div class="panel"><h3>📊 إحصائيات المنصة (صلاحيات الإشراف)</h3>
      <div class="kpis">
        <div class="kpi"><small>👥 المستخدمون</small><b>${nU}</b></div>
        <div class="kpi"><small>🏟️ الأندية</small><b>${nC}</b></div>
        <div class="kpi"><small>📋 الطلبات</small><b>${nR}</b></div>
        <div class="kpi"><small>🌍 الدول</small><b>${DB.countries().length}</b></div>
      </div>
      <div style="display:grid;gap:10px">
        <div><small>⏳ قيد المراجعة ${pp} (${pct(pp)}٪)</small><div class="bar"><i style="width:${pct(pp)}%"></i></div></div>
        <div><small>✅ مقبولة ${pa} (${pct(pa)}٪)</small><div class="bar"><i style="width:${pct(pa)}%"></i></div></div>
        <div><small>❌ مرفوضة ${pr} (${pct(pr)}٪)</small><div class="bar"><i style="width:${pct(pr)}%"></i></div></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="DB.reset();render();toast('أُعيدت البيانات التجريبية')">🔄 إعادة تعيين البيانات التجريبية</button>
      </div>
    </div>`;

  document.getElementById("pane-users").innerHTML = `
    <div class="panel"><h3>👥 إدارة المستخدمين (${nU})</h3>
      <div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الدور</th><th>معلومة</th></tr></thead><tbody>
      ${db.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td><small>${esc(u.email)}</small></td>
        <td>${u.role==="player"?"⚽ لاعب":u.role==="club"?"🏟️ نادي":"📊 مشرف"}</td>
        <td><small>${esc(u.country||u.clubId||"—")}</small></td></tr>`).join("")}
      </tbody></table></div>
      <p style="color:var(--muted);font-size:.85rem">ملاحظة: إنشاء حسابات اللاعبين يتم من صفحة الدخول. حسابات الأندية تُدار مع سجلات الأندية.</p>
    </div>`;

  document.getElementById("pane-clubs").innerHTML = `
    <div class="panel"><h3>🏟️ إدارة الأندية (${nC})</h3>
      <div class="table-wrap"><table><thead><tr><th>النادي</th><th>الدولة</th><th>الأنشطة</th><th>الطلبات</th></tr></thead><tbody>
      ${db.clubs.map(c=>`<tr><td><b>${c.flag} ${esc(c.name)}</b></td><td>${esc(c.country)}</td><td>${c.activities.length}</td><td>${db.requests.filter(r=>r.clubId===c.id).length}</td></tr>`).join("")}
      </tbody></table></div>
      <h3 style="margin-top:16px">+ إضافة نادٍ جديد</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field"><label>اسم النادي</label><input id="nc-name"></div>
        <div class="field"><label>الدولة</label><input id="nc-country"></div>
        <div class="field"><label>المدينة</label><input id="nc-city"></div>
        <div class="field"><label>الملعب</label><input id="nc-stad"></div>
      </div>
      <div class="field"><label>الوصف</label><textarea id="nc-desc" rows="2"></textarea></div>
      <button class="btn btn-primary" onclick="addClub()">إضافة النادي 🏟️</button>
    </div>`;

  document.getElementById("pane-reqs").innerHTML = `
    <div class="panel"><h3>📋 الإشراف على الطلبات (${nR})</h3>
      <div class="table-wrap"><table><thead><tr><th>المعرف</th><th>النادي</th><th>الفترة</th><th>الحالة</th></tr></thead><tbody>
      ${db.requests.map(r=>{ const c = DB.club(r.clubId)||{name:"—",flag:""}; return `<tr><td><small>${esc(r.id)}</small></td><td>${c.flag} ${esc(c.name)}</td><td><small>${esc(r.start)} ← ${esc(r.end)}</small></td><td>${statusLabel(r.status)}</td></tr>`; }).join("")}
      </tbody></table></div>
    </div>`;
}
window.tab = tab;
window.addClub = function(){
  const name = document.getElementById("nc-name").value.trim(), country = document.getElementById("nc-country").value.trim();
  if(!name || !country){ toast("أدخل اسم النادي والدولة"); return; }
  DB.addClub({ name, country, city: document.getElementById("nc-city").value.trim(), stadium: document.getElementById("nc-stad").value.trim(), desc: document.getElementById("nc-desc").value.trim()||"نادٍ جديد انضم لمنصة PlayPass.", activities:["تدريب كرة قدم جماعي","جولة في الملعب"] });
  toast("تمت إضافة النادي ✅"); render();
};
if(s) render();
</script>
</body>
</html>
