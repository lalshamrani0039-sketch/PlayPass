<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلباتي | PlayPass</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1a33">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
<header class="site-header" id="siteHeader"></header>
<main class="container" id="main">
  <div class="section">
    <div class="section-head"><div><h2>📋 طلباتي</h2><p>تابع حالة طلبات الزيارة مصنّفة حسب الحالة</p></div><a class="btn btn-primary btn-sm" href="clubs.html">+ طلب جديد</a></div>
    <div class="tabs">
      <button class="tab active" data-f="" onclick="setFilter('',this)">الكل</button>
      <button class="tab" data-f="pending" onclick="setFilter('pending',this)">⏳ قيد المراجعة</button>
      <button class="tab" data-f="approved" onclick="setFilter('approved',this)">✅ تمت الموافقة</button>
      <button class="tab" data-f="rejected" onclick="setFilter('rejected',this)">❌ مرفوضة</button>
    </div>
    <div class="grid clubs" id="grid"></div>
    <p id="empty" style="color:var(--muted)"></p>
  </div>
</main>
<footer id="siteFooter"></footer><div id="toasts"></div>
<script src="js/seed.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
<script>
renderChrome("req");
const s = requireRole(["player", "visitor"], "login.html");
let F = "";
function setFilter(f, btn){ F = f; document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active")); btn.classList.add("active"); render(); }
function render(){
  let list = s ? DB.myRequests(s.id) : [];
  if(F) list = list.filter(r=>r.status===F);
  document.getElementById("grid").innerHTML = list.map(r=>{
    const c = DB.club(r.clubId) || { name:"نادٍ محذوف", flag:"🏟️", country:"", color1:"#555", color2:"#222", emoji:"⚽" };
    return `<article class="card">
      <div class="card-cover" style="background:linear-gradient(135deg,${c.color1},${c.color2})">${ph(clubImg(c.id||"", 700), c.emoji, c.name)}<span class="shade"></span><span class="flag">${c.flag}</span></div>
      <div class="card-body"><h3>${esc(c.name)}</h3><div>${statusLabel(r.status)}</div>
        <div class="meta"><span class="tag">📅 ${esc(r.start)} ← ${esc(r.end)}</span><span class="tag green">${r.activities.length} أنشطة</span></div>
      </div>
      <div class="card-actions">
        <a class="btn btn-ghost btn-sm" href="request-details.html?id=${r.id}">التفاصيل</a>
        ${r.status==="approved" ? `<a class="btn btn-primary btn-sm" href="schedule.html?request=${r.id}">📅 عرض الجدول</a>` : ""}
      </div></article>`;
  }).join("");
  document.getElementById("empty").textContent = list.length ? "" : "لا توجد طلبات هنا بعد — ابدأ بزيارة صفحة الأندية وقدّم أول طلب! ⚽";
}
if(s) render();
</script>
</body>
</html>
