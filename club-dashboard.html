<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم النادي | PlayPass</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1a33">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
<header class="site-header" id="siteHeader"></header>
<main class="container" id="main">
  <div class="section">
    <div class="section-head"><div><h2>🛠️ لوحة تحكم النادي</h2><p>إدارة بيانات النادي، الأنشطة، طلبات الزيارة والجداول.</p></div></div>

    <!-- بيانات النادي -->
    <div class="panel reveal">
      <h3>🏟️ بيانات النادي</h3>
      <div class="field"><label>اسم النادي</label><input id="clubName" type="text"></div>
      <div class="field"><label>الدولة</label><input id="clubCountry" type="text"></div>
      <div class="field"><label>المدينة</label><input id="clubCity" type="text"></div>
      <div class="field"><label>الملعب</label><input id="clubStadium" type="text"></div>
      <div class="field"><label>الشعار (إيموجي)</label><input id="clubEmoji" type="text" placeholder="⚽"></div>
      <div class="field"><label>وصف النادي</label><textarea id="clubDesc" rows="3"></textarea></div>
      <button class="btn btn-primary" onclick="saveClub()">💾 حفظ البيانات</button>
    </div>

    <!-- الأنشطة -->
    <div class="panel reveal">
      <h3>🎯 الأنشطة المتاحة للزوار</h3>
      <div id="activitiesList" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <input id="newAct" type="text" placeholder="نشاط جديد..." style="flex:1;padding:10px;border:1.5px solid var(--border);border-radius:11px;font-family:inherit">
        <button class="btn btn-accent" onclick="addAct()">إضافة</button>
      </div>
    </div>

    <!-- الطلبات -->
    <div class="panel reveal">
      <h3>📥 طلبات الزيارة الواردة</h3>
      <div class="table-wrap"><table><thead><tr><th>اللاعب</th><th>الفترة</th><th>الأنشطة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody id="reqTableBody"></tbody></table></div>
    </div>

    <!-- الجداول -->
    <div class="panel reveal">
      <h3>📅 إعداد الجداول</h3>
      <div class="field"><label>اختر الطلب المقبول</label><select id="selReq" onchange="renderSlots()"></select></div>
      <div id="slotList" style="display:grid;gap:8px;margin-bottom:12px"></div>
      <div class="field"><label>اليوم</label><input id="nDay" placeholder="مثال: اليوم 1 — 10 نوفمبر"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field"><label>الوقت</label><input id="nTime" placeholder="09:00 - 11:00"></div>
        <div class="field"><label>الموقع</label><input id="nPlace" placeholder="الملعب الرئيسي"></div>
      </div>
      <div class="field"><label>النشاط / العنوان</label><input id="nTitle" placeholder="تدريب صباحي"></div>
      <button class="btn btn-primary" onclick="addSlot()">إضافة موعد</button>
    </div>
  </div>
</main>
<footer id="siteFooter"></footer><div id="toasts"></div>
<script src="js/seed.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
<script>
renderChrome("club");

const s = requireRole(["club"], "login.html");
if(!s || !s.clubId) location.href = "login.html";

const club = DB.getClub(s.clubId);
if(!club) location.href = "login.html";

// تعبئة النموذج
document.getElementById("clubName").value = club.name || "";
document.getElementById("clubCountry").value = club.country || "";
document.getElementById("clubCity").value = club.city || "";
document.getElementById("clubStadium").value = club.stadium || "";
document.getElementById("clubEmoji").value = club.emoji || "⚽";
document.getElementById("clubDesc").value = club.desc || "";

// حفظ بيانات النادي
function saveClub(){
  const patch = {
    name: document.getElementById("clubName").value.trim(),
    country: document.getElementById("clubCountry").value.trim(),
    city: document.getElementById("clubCity").value.trim(),
    stadium: document.getElementById("clubStadium").value.trim(),
    emoji: document.getElementById("clubEmoji").value.trim() || "⚽",
    desc: document.getElementById("clubDesc").value.trim()
  };
  DB.updateClub(s.clubId, patch);
  toast("تم حفظ البيانات ✅");
  renderClubInfo();
}

// عرض الأنشطة
function renderActs(){
  const list = document.getElementById("activitiesList");
  list.innerHTML = (club.activities||[]).map((x,i)=>`
    <div class="card">
      <div class="card-body"><b>${esc(x)}</b><button class="btn btn-danger btn-sm" onclick="delAct(${i})">✕</button></div>
    </div>
  `).join("");
}
renderActs();

function addAct(){
  const v = document.getElementById("newAct").value.trim();
  if(!v) return;
  const c = DB.getClub(s.clubId);
  c.activities.push(v);
  DB.updateClub(s.clubId, {activities: c.activities});
  renderActs();
  document.getElementById("newAct").value = "";
}

function delAct(i){
  const c = DB.getClub(s.clubId);
  c.activities.splice(i,1);
  DB.updateClub(s.clubId, {activities: c.activities});
  renderActs();
  renderReqs();
}

// عرض الطلبات
function renderReqs(){
  const reqs = DB.getClubRequests(s.clubId);
  const tbody = document.getElementById("reqTableBody");
  tbody.innerHTML = reqs.map(r => {
    const p = DB.getUsers().find(u => u.id === r.playerId);
    const pname = p ? p.name : "لاعب";
    return `<tr>
      <td><b>${esc(p.name)}</b><br><small style="color:var(--muted)">${esc(r.createdAt)}</small></td>
      <td><small>${esc(r.start)} ← ${esc(r.end)}</small></td>
      <td><small>${r.activities.map(esc).join("، ")}</small></td>
      <td>${statusLabel(r.status)}</td>
      <td style="white-space:nowrap">
        ${r.status==="pending" ? `
          <button class="btn btn-primary btn-sm" onclick="decide('${r.id}','approved')">قبول</button>
          <button class="btn btn-danger btn-sm" onclick="decide('${r.id}','rejected')">رفض</button>
        ` : `<small style="color:var(--muted)">تم البت</small>`}
      </td>
    </tr>`;
  }).join("");
}

// عرض الجداول
function renderSlots(){
  const rid = document.getElementById("selReq").value;
  if(!rid) return;
  const slots = DB.getScheduleFor(rid);
  const list = document.getElementById("slotList");
  list.innerHTML = slots.map(x => `
    <div class="slot">
      <div class="time">${esc(x.time)}</div>
      <div style="flex:1"><b>${esc(x.title)}</b><br><small style="color:var(--muted)">${esc(x.day)} • 📍 ${esc(x.place)}</small></div>
      <button class="btn btn-danger btn-sm" onclick="delSlot('${x.id}')">✕</button>
    </div>
  `).join("");
}

function addSlot(){
  const requestId = document.getElementById("selReq").value;
  const day = document.getElementById("nDay").value.trim();
  const time = document.getElementById("nTime").value.trim();
  const place = document.getElementById("nPlace").value.trim();
  const title = document.getElementById("nTitle").value.trim();
  if(!day || !time || !title){ toast("أكمل اليوم والوقت والنشاط"); return; }
  DB.addSlot({ requestId, day, time, place: place||"—", title });
  renderSlots();
  document.getElementById("nDay").value = "";
  document.getElementById("nTime").value = "";
  document.getElementById("nPlace").value = "";
  document.getElementById("nTitle").value = "";
}

function delSlot(id){
  DB.removeSlot(id);
  renderSlots();
}

// تحديث قائمة الطلبات المقبولة
function updateSelReq(){
  const selReq = document.getElementById("selReq");
  const current = selReq.value;
  selReq.innerHTML = "";
  const accepted = DB.getRequests().filter(r => r.clubId === s.clubId && r.status === "approved");
  accepted.forEach(r => {
    const o = document.createElement("option");
    o.value = r.id;
    o.textContent = `${esc(r.start)} ← ${esc(r.end)}`;
    if(o.value === current) o.selected = true;
    selReq.appendChild(o);
  });
}

// تهيئة الصفحة
renderReqs();
renderSlots();
updateSelReq();

// تحديث القائمة تلقائياً
setInterval(() => {
  renderReqs();
  updateSelReq();
  renderSlots();
}, 5000);
</script>
</body>
</html>
