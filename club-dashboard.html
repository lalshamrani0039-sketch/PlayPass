<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم النادي | PlayPass</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1a33">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>
<header class="site-header" id="siteHeader"></header>
<main class="container" id="main">
  <div class="dash">
    <aside class="side" aria-label="قائمة النادي">
      <a href="#" class="active" data-t="over" onclick="tab('over',this);return false">📊 نظرة عامة</a>
      <a href="#" data-t="prof" onclick="tab('prof',this);return false">🏟️ بيانات النادي</a>
      <a href="#" data-t="acts" onclick="tab('acts',this);return false">🎯 الأنشطة</a>
      <a href="#" data-t="reqs" onclick="tab('reqs',this);return false">📥 طلبات الزيارة <span id="pendBadge"></span></a>
      <a href="#" data-t="sched" onclick="tab('sched',this);return false">📅 الجداول</a>
    </aside>
    <div>
      <div id="pane-over"></div>
      <div id="pane-prof" style="display:none"></div>
      <div id="pane-acts" style="display:none"></div>
      <div id="pane-reqs" style="display:none"></div>
      <div id="pane-sched" style="display:none"></div>
    </div>
  </div>
</main>
<footer id="siteFooter"></footer><div id="toasts"></div>
<script src="js/seed.js"></script><script src="js/store.js"></script><script src="js/app.js"></script>
<script>
renderChrome("club");
const s = requireRole(["club"], "login.html");
const clubId = s ? s.clubId : null;

function tab(t, el){
  document.querySelectorAll(".side a").forEach(a=>a.classList.remove("active"));
  if(el) el.classList.add("active");
  ["over","prof","acts","reqs","sched"].forEach(k=> document.getElementById("pane-"+k).style.display = k===t ? "" : "none");
}
function playerName(id){ const u = DB.users().find(x=>x.id===id); return u ? u.name : "لاعب"; }

function render(){
  if(!s) return;
  const club = DB.club(clubId);
  if(!club){ document.getElementById("pane-over").innerHTML = '<div class="alert err">لا يوجد نادٍ مرتبط بهذا الحساب.</div>'; return; }
  const reqs = DB.clubRequests(clubId);
  const p = reqs.filter(r=>r.status==="pending").length,
        a = reqs.filter(r=>r.status==="approved").length,
        j = reqs.filter(r=>r.status==="rejected").length;
  document.getElementById("pendBadge").innerHTML = p ? `<span class="tag gold">${p} جديد</span>` : "";

  // Overview
  document.getElementById("pane-over").innerHTML = `
    <div class="panel"><h3>مرحباً ${esc(club.name)} ${club.flag} 👋</h3><p style="color:var(--muted)">أدر بيانات ناديك وأنشطتك، وراجع طلبات اللاعبين، وأعدّ جداول المقبولين.</p></div>
    <div class="kpis">
      <div class="kpi"><small>⏳ قيد المراجعة</small><b>${p}</b></div>
      <div class="kpi"><small>✅ مقبولة</small><b>${a}</b></div>
      <div class="kpi"><small>❌ مرفوضة</small><b>${j}</b></div>
      <div class="kpi"><small>🎯 الأنشطة</small><b>${club.activities.length}</b></div>
    </div>`;

  // Profile
  document.getElementById("pane-prof").innerHTML = `
    <div class="panel"><h3>🏟️ بيانات النادي وصورته</h3>
      <div class="field"><label>اسم النادي</label><input id="f-name" value="${esc(club.name)}"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label>الدولة</label><input id="f-country" value="${esc(club.country)}"></div>
        <div class="field"><label>المدينة</label><input id="f-city" value="${esc(club.city)}"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label>الملعب</label><input id="f-stad" value="${esc(club.stadium)}"></div>
        <div class="field"><label>الشعار (إيموجي)</label><input id="f-emoji" value="${esc(club.emoji)}"></div>
      </div>
      <div class="field"><label>وصف النادي</label><textarea id="f-desc" rows="4">${esc(club.desc)}</textarea></div>
      <button class="btn btn-primary" onclick="saveProf()">💾 حفظ البيانات</button>
    </div>`;

  // Activities
  document.getElementById("pane-acts").innerHTML = `
    <div class="panel"><h3>🎯 الأنشطة المتاحة للزوار</h3>
      ${club.activities.map((x,i)=>`<div class="check" style="margin-bottom:8px"><span style="flex:1"><b>${esc(x)}</b></span><button class="btn btn-danger btn-sm" onclick="delAct(${i})">حذف</button></div>`).join("") || '<p style="color:var(--muted)">لا توجد أنشطة بعد.</p>'}
      <div style="display:flex;gap:8px;margin-top:12px"><input id="newAct" placeholder="نشاط جديد... مثال: تدريب حراس" style="flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:11px;padding:10px 13px;font-family:inherit;color:var(--text)"><button class="btn btn-accent" onclick="addAct()">+ إضافة</button></div>
    </div>`;

  // Requests
  document.getElementById("pane-reqs").innerHTML = `
    <div class="panel"><h3>📥 طلبات الزيارة الواردة (${reqs.length})</h3>
      <div class="table-wrap"><table><thead><tr><th>اللاعب</th><th>الفترة</th><th>الأنشطة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>
      ${reqs.map(r=>`<tr><td><b>${esc(playerName(r.playerId))}</b><br><small style="color:var(--muted)">${esc(r.createdAt)}${r.notes? " • 📝 "+esc(r.notes.slice(0,30)):""}</small></td>
        <td><small>${esc(r.start)} ← ${esc(r.end)}</small></td><td><small>${r.activities.map(esc).join("، ")}</small></td>
        <td>${statusLabel(r.status)}</td>
        <td style="white-space:nowrap">${r.status==="pending"
          ? `<button class="btn btn-primary btn-sm" onclick="decide('${r.id}','approved')">قبول ✅</button> <button class="btn btn-danger btn-sm" onclick="decide('${r.id}','rejected')">رفض ❌</button>`
          : `<small style="color:var(--muted)">تم البت</small>`}</td></tr>`).join("") || '<tr><td colspan="5">لا توجد طلبات بعد.</td></tr>'}
      </tbody></table></div></div>`;

  // Schedules
  const accepted = reqs.filter(r=>r.status==="approved");
  document.getElementById("pane-sched").innerHTML = `
    <div class="panel"><h3>📅 إعداد جداول المقبولين</h3>
      ${accepted.length ? `
      <div class="field"><label>اختر الطلب المقبول</label><select id="selReq" onchange="renderSlots()">${accepted.map(r=>`<option value="${r.id}">${esc(playerName(r.playerId))} — ${esc(r.start)} (${r.id})</option>`).join("")}</select></div>
      <div id="slotList" style="display:grid;gap:8px;margin-bottom:12px"></div>
      <div class="field"><label>اليوم</label><input id="n-day" placeholder="مثال: اليوم 1 — 10 نوفمبر"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="field"><label>الوقت</label><input id="n-time" placeholder="09:00 - 11:00"></div>
        <div class="field"><label>الموقع</label><input id="n-place" placeholder="الملعب الرئيسي"></div>
      </div>
      <div class="field"><label>النشاط / العنوان</label><input id="n-title" placeholder="تدريب صباحي"></div>
      <button class="btn btn-primary" onclick="addSlot()">+ إضافة موعد للجدول</button>`
      : '<div class="alert info">لا توجد طلبات مقبولة بعد — اقبل طلباً من تبويب «طلبات الزيارة» ليظهر هنا.</div>'}
    </div>`;
  if(accepted.length) renderSlots();
}
function renderSlots(){
  const rid = document.getElementById("selReq").value;
  const slots = DB.scheduleFor(rid);
  document.getElementById("slotList").innerHTML = slots.map(x=>`
    <div class="slot"><div class="time">${esc(x.time)}</div>
      <div style="flex:1"><b>${esc(x.title)}</b><br><small style="color:var(--muted)">${esc(x.day)} • 📍 ${esc(x.place)}</small></div>
      <button class="btn btn-danger btn-sm" onclick="delSlot('${x.id}')">✕</button></div>`).join("") || '<small style="color:var(--muted)">لا مواعيد بعد لهذا الطلب.</small>';
}
window.saveProf = function(){
  DB.updateClub(clubId, { name:document.getElementById("f-name").value.trim(), country:document.getElementById("f-country").value.trim(), city:document.getElementById("f-city").value.trim(), stadium:document.getElementById("f-stad").value.trim(), emoji:document.getElementById("f-emoji").value.trim()||"⚽", desc:document.getElementById("f-desc").value.trim() });
  toast("تم حفظ بيانات النادي ✅"); render();
};
window.addAct = function(){
  const v = document.getElementById("newAct").value.trim(); if(!v) return;
  const c = DB.club(clubId); c.activities.push(v); DB.updateClub(clubId,{activities:c.activities}); render(); toast("أُضيف النشاط 🎯");
};
window.delAct = function(i){ const c = DB.club(clubId); c.activities.splice(i,1); DB.updateClub(clubId,{activities:c.activities}); render(); };
window.decide = function(id, st){ DB.setStatus(id, st); toast(st==="approved" ? "تم قبول الطلب ✅" : "تم رفض الطلب ❌"); render(); };
window.addSlot = function(){
  const requestId = document.getElementById("selReq").value;
  const day = document.getElementById("n-day").value.trim(), time = document.getElementById("n-time").value.trim(),
        place = document.getElementById("n-place").value.trim(), title = document.getElementById("n-title").value.trim();
  if(!day || !time || !title){ toast("أكمل اليوم والوقت والنشاط"); return; }
  DB.addSlot({ requestId, day, time, place: place||"—", title }); renderSlots(); toast("أُضيف الموعد 📅");
};
window.delSlot = function(id){ DB.removeSlot(id); renderSlots(); };
window.renderSlots = renderSlots; window.tab = tab;
if(s) render();
</script>
</body>
</html>
